name: Engineering task
description: Task contract for substantial Hearloop engineering work. Field meanings live in docs/agents/workflow.md.
title: "[task] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Use this form for work that spans stages, creates follow-up, or can affect production.
        Definitions: [docs/agents/workflow.md](../docs/agents/workflow.md).
        Do not treat pull requests as a request surface.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Requested outcome. See workflow.md Start task.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      description: Guided is default. Fast is explicit and expires with this task.
      options:
        - guided
        - fast
      default: 0
    validations:
      required: true
  - type: textarea
    id: scope-include
    attributes:
      label: Included scope
    validations:
      required: true
  - type: textarea
    id: scope-exclude
    attributes:
      label: Excluded scope
    validations:
      required: true
  - type: textarea
    id: applied-decision-ids
    attributes:
      label: Applied decision IDs
      description: IDs from docs/agents/decisions.yaml, or none.
    validations:
      required: true
  - type: textarea
    id: assumptions-verified
    attributes:
      label: Verified assumptions
    validations:
      required: true
  - type: textarea
    id: assumptions-default
    attributes:
      label: Default assumptions
    validations:
      required: true
  - type: textarea
    id: assumptions-unresolved
    attributes:
      label: Unresolved assumptions
      description: Consequential unresolved items block dependent work.
    validations:
      required: true
  - type: textarea
    id: required-skills
    attributes:
      label: Required skills
    validations:
      required: true
  - type: textarea
    id: approved-test-seams
    attributes:
      label: Approved test seams
    validations:
      required: true
  - type: textarea
    id: required-verification
    attributes:
      label: Required verification
    validations:
      required: true
  - type: textarea
    id: rollout
    attributes:
      label: Rollout
      description: Strategy, or not_applicable with reason.
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Rollback
    validations:
      required: true
  - type: textarea
    id: observability
    attributes:
      label: Observability
      description: Signals, alerts, dashboards, or not_applicable with reason.
    validations:
      required: true
  - type: textarea
    id: maintenance-owner
    attributes:
      label: Maintenance owner
    validations:
      required: true
  - type: textarea
    id: definition-of-done
    attributes:
      label: Definition of done
      description: Distinguish implemented, released, and complete as defined in workflow.md.
    validations:
      required: true
