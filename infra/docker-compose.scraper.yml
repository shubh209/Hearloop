# Local HTTP-only scraper sidecar for business-context import.
# Usage: docker compose -f infra/docker-compose.scraper.yml up -d
# API: set SCRAPER_URL=http://127.0.0.1:11235 in .env

services:
  hearloop-scraper:
    build:
      context: ../services/scraper
    ports:
      - "127.0.0.1:11235:11235"
    restart: unless-stopped
    mem_limit: 512m
